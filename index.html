<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- No viewport-fit=cover: on iOS 26.x (measured on 26.5.1) it triggers the
      web-app letterbox bug — the view is sized minus the status bar but
      anchored at the screen top, leaving a dead ~62pt band at the bottom.
      Without it the view sits below the status bar and reaches the true
      screen bottom; the status-bar strip is colored via the theme-color meta
      (synced to the active theme by ThemeManager). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Cassia</title>
    <meta name="name" content="Cassia" />
    <meta name="author" content="faralaks" />
    <meta
      name="description"
      content="A Telegram Desktop inspired Matrix client, secured by e2ee and built on open source. Forked from Cinny."
    />
    <meta name="keywords" content="cassia, matrix, matrix client, matrix.org, cinny" />

    <meta property="og:title" content="Cassia" />
    <meta property="og:url" content="https://github.com/faralaks/cassia-app" />
    <meta
      property="og:description"
      content="A Telegram Desktop inspired Matrix client, secured by e2ee and built on open source. Forked from Cinny."
    />
    <meta name="theme-color" content="#000000" />

    <link id="favicon" rel="shortcut icon" href="./public/favicon.ico" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cassia" />
    <meta name="apple-mobile-web-app-title" content="Cassia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": on iOS 26.x (incl. 26.5) translucent
      web apps get a letterboxed viewport — sized minus the status bar but
      anchored at the screen top, leaving a dead ~62pt band at the bottom
      (WebKit #301994 class of bugs). With "default" the same view sits below
      the status bar and reaches the true screen bottom; iOS paints the bar
      area from the theme-color meta, which ThemeManager keeps in sync with
      the active theme. Baked at add-to-home-screen time — reinstall to apply. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link

      sizes="57x57"
      href="./public/res/apple/apple-touch-icon-57x57.png"
    />

      rel="apple-touch-icon"
      sizes="60x60"
      href="./public/res/apple/apple-touch-icon-60x60.png"
    />

      rel="apple-touch-icon"
      sizes="72x72"

    />

      rel="apple-touch-icon"

      href="./public/res/apple/apple-touch-icon-76x76.png"

      rel="apple-touch-icon"

    />

      sizes="120x120"

    />

      rel="apple-touch-icon"
      sizes="144x144"
      href="./public/res/apple/apple-touch-icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"

    <link

    <!-- iOS launch screens. Always the dark variant: iOS snapshots the
      startup image at add-to-home-screen time and does not reliably
      re-evaluate prefers-color-scheme afterwards, so a scheme-dependent
      splash sticks to whatever matched at install. Dark is the theme in
      daily use. Generated by scripts/generate-ios-splash.mjs
      (npm run generate:splash), which also emits unused light variants. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"

    />
