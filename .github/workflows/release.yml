name: Release

# On a two-part version tag (e.g. v1.0), build the static app ONCE and then fan
# out in parallel to:
#   - a multi-arch Docker image on ghcr.io (:1.0 and :latest)
#   - a Cloudflare deployment (Workers Static Assets). The target Worker depends
#     on the tag: stable v1.0 → cassia-app (production); pre-release v1.0-beta
#     (any -suffix) → cassia-dev. Same build, different Worker.
#
#   git tag v1.0        # → production (cassia-app)
#   git tag v1.0-beta   # → dev (cassia-dev)
#   git push origin v1.0
#
# The tag is baked into the build as the app version (About / login screen).
# The app is a static SPA, so the compiled dist/ is identical on every CPU arch
# and across both targets — it's built once here and reused, no rebuilds.
#
# Cloudflare needs two repository secrets (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN (with the Workers/Pages edit permission) and
# CLOUDFLARE_ACCOUNT_ID. Optional CUSTOM_HOMESERVER presets the login server.
# `wrangler deploy` auto-creates/updates the cassia-app Worker (see wrangler.toml).

on:
  push:
    tags:
      # Strict two-part version tags only: v1.0 (stable) and v1.0-beta (pre-release).
      # GitHub tag filters are globs, not regex, so this is a coarse gate; the
      # exact shape is enforced again by the type=match regex in the docker job.
      - 'v[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*-*'

jobs:
  # ── Build the static site once (native, fast), gated on typecheck ──────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Bake the tag (e.g. v1.0) into the app version.
        env:
          CASSIA_VERSION: ${{ github.ref_name }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # ── Wrap the prebuilt dist/ in nginx → multi-arch image on ghcr ───────────
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strict two-part version tags. Capture the FULL version incl any
          # -suffix and anchor with $, so:
          #   v1.0       → :1.0
          #   v1.0-beta  → :1.0-beta   (distinct, never clobbers :1.0)
          #   v1.0.0     → no match (rejected)
          # :latest moves only on stable tags (no '-' suffix), so a pre-release
          # never becomes :latest.
          tags: |
            type=match,pattern=^v(\d+\.\d+(?:-.+)?)$,group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push (serve-only, just COPYs dist)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy the same prebuilt dist/ to Cloudflare (Workers Static Assets) ───
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        # Needed for wrangler.toml (the assets config); the build is reused via
        # the artifact below, not rebuilt here.
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set preferred homeserver in config.json
        # Cloudflare-only: patch the served config's preferredHomeserver from the
        # CUSTOM_HOMESERVER secret (same field the Docker entrypoint sets at
        # runtime). Touches only this job's copy of the artifact, not the Docker
        # image. No-op if the secret is unset.
        env:
          CUSTOM_HOMESERVER: ${{ secrets.CUSTOM_HOMESERVER }}
        run: |
          if [ -n "$CUSTOM_HOMESERVER" ]; then
            echo "Setting preferredHomeserver=$CUSTOM_HOMESERVER"
            tmp="$(mktemp)"
            jq --arg hs "$CUSTOM_HOMESERVER" '.preferredHomeserver = $hs' dist/config.json > "$tmp"
            mv "$tmp" dist/config.json
          else
            echo "CUSTOM_HOMESERVER not set — leaving config.json as-is"
          fi

      - name: Pick Cloudflare target Worker from tag
        # Stable tags (v1.0) deploy to the production Worker; pre-release tags
        # with a -suffix (v1.0-beta) deploy to the separate dev Worker so betas
        # never touch production. wrangler auto-creates the Worker if missing.
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "name=cassia-dev" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag → deploying to cassia-dev"
          else
            echo "name=cassia-app" >> "$GITHUB_OUTPUT"
            echo "Stable tag → deploying to cassia-app"
          fi

      - name: Deploy to Cloudflare (Workers Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler v4: the action defaults to an older v3 that doesn't
          # support assets-only deploys / not_found_handling=single-page-application.
          wranglerVersion: '4.103.0'
          # `wrangler deploy` reads wrangler.toml ([assets] directory=./dist) and
          # --name overrides the Worker name so stable → cassia-app and
          # pre-release → cassia-dev share one config but different Workers.
          command: deploy --name ${{ steps.target.outputs.name }}

  # ── Announce the finished rollout to Matrix (via a bot webhook) ─────────────
  # Runs only after BOTH the ghcr image and the Cloudflare deployment succeed.
  # Needs three repository secrets (all secret so the notification target isn't
  # discoverable from this public workflow):
  #   MATRIX_BOT_URL     — full endpoint URL (https://.../send/room)
  #   MATRIX_BOT_API_KEY — an X-Api-Key the bot accepts
  #   MATRIX_BOT_ROOM    — target room alias (e.g. #rollouts)
  notify:
    needs: [docker, cloudflare]
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment message
        env:
          MATRIX_BOT_URL: ${{ secrets.MATRIX_BOT_URL }}
          MATRIX_BOT_API_KEY: ${{ secrets.MATRIX_BOT_API_KEY }}
          MATRIX_BOT_ROOM: ${{ secrets.MATRIX_BOT_ROOM }}
        run: |
          tag="${{ github.ref_name }}"
          # Same rule as the Cloudflare target: -suffix = pre-release = dev.
          if [[ "$tag" == *-* ]]; then target="cassia-dev"; else target="cassia"; fi
          # --form-string, never -F: curl's -F treats a leading '<' as
          # "read this file", which would mangle the HTML payload.
          curl -sf -X POST "$MATRIX_BOT_URL" \
            -H "X-Api-Key: $MATRIX_BOT_API_KEY" \
            --form-string "room_id=$MATRIX_BOT_ROOM" \
            --form-string "message=$target@$tag deployed!" \
            --form-string "html=$target@<strong>$tag</strong> deployed!"
